<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Our Employess</h1>
        <input type="search" name="search" id="search" placeholder="Enter Name">
        <form action="">
            <div>
                <label for="name">Name:</label>
                <input type="text" name="name-of-employee" id="name" placeholder="Jhon Doe">
            </div>
            <div>
                <label for="position">Position:</label>
                <input type="text" name="position-of-employee" id="position">
            </div>
            <div>
                <label for="department">Department:</label>
                <input type="text" name="department-of-employee" id="department">
            </div>
            <div>
                <label for="salary">Salary:</label>
                <input type="number" name="salary-of-employee" id="salary">
            </div>
            <button type="submit">Add</button>
        </form>
    </header>
    <main></main>
    <script src="script.js"></script>
</body>

</html>
